name: Production Pipeline

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run check:syntax
      - run: npm run check:docs
      - name: Check Python syntax
        run: python -m compileall -q python

  tests:
    name: Tool Regression Tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: npm ci
      - name: Install conversion dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r python/requirements.txt
          .venv/bin/python -m pip check
          .venv/bin/python python/setup_ocr.py
      - run: npx playwright install --with-deps chromium
      - name: Verify PDF editability and Office-independent Word-to-PDF fallback
        run: .venv/bin/python -m unittest discover -s python/tests -v
      - name: Run all tool tests, including real conversions
        run: npm run test:tools
      - name: Save test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tool-test-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    name: Production Build
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build production assets
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build
      - name: Save immutable production artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release-check:
    name: Release Checks
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-site-${{ github.sha }}
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Test the exact built artifact
        run: npm run test:smoke
      - name: Save release diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-test-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy Production
    needs: [quality, tests, build, release-check]
    if: ${{ github.ref == 'refs/heads/prod' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: prod
    concurrency:
      group: firebase-hosting-prod
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'easymadeinsights' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Reject superseded revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" --jq '.object.sha')"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "::error::A newer commit exists on prod. Deploy its successful pipeline instead."
            exit 1
          fi
      - name: Validate deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          let account;
          try {
            account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || "");
          } catch {
            console.error("Configure the prod environment secret FIREBASE_SERVICE_ACCOUNT with service-account JSON.");
            process.exit(1);
          }
          if (account.type !== "service_account" || !account.client_email || !account.private_key ||
              account.project_id !== process.env.FIREBASE_PROJECT_ID) {
            console.error("The deployment service account must be complete and belong to FIREBASE_PROJECT_ID.");
            process.exit(1);
          }
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-site-${{ github.sha }}
          path: dist/
      - name: Deploy verified artifact to Firebase live
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .
          firebaseToolsVersion: 15.33.0
