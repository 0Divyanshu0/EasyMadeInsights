<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">EasyMadeInsights: from spreadsheets to a clearer next step</title>
  <desc id="description">A branded blue and cream illustration of spreadsheet rows becoming charts, with workbook analytics and file tools as two connected workspaces.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#DBEAFE"/></linearGradient>
    <linearGradient id="card" x1="730" y1="92" x2="1080" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#122849"/><stop offset="1" stop-color="#0B1730"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#2563EB" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1110" cy="42" r="190" fill="#60A5FA" opacity=".12"/>
  <circle cx="760" cy="422" r="132" fill="#38BDF8" opacity=".08"/>
