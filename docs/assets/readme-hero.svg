    <rect x="708" y="66" width="414" height="288" rx="22" fill="url(#card)"/>
    <circle cx="732" cy="88" r="4" fill="#60A5FA"/><circle cx="748" cy="88" r="4" fill="#334155"/><circle cx="764" cy="88" r="4" fill="#334155"/>
    <text x="735" y="131" fill="#DBEAFE" font-size="15" font-weight="600">A new perspective on your workbook</text>
