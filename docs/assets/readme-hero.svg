    <path d="M59 66V58M69 66V52M79 66V46" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <text x="104" y="67" fill="#0F172A" font-size="27" font-weight="750">EasyMade<tspan fill="#2563EB">Insights</tspan></text>
    <text x="50" y="115" fill="#475569" font-size="12" letter-spacing="2.5" font-weight="700">LESS FRICTION. MORE PERSPECTIVE.</text>
    <text x="48" y="186" fill="#0F172A" font-family="Georgia, serif" font-size="53">From spreadsheets to</text>
    <text x="48" y="250" fill="#2563EB" font-family="Georgia, serif" font-size="53">a clearer next step.</text>
    <text x="50" y="296" fill="#475569" font-size="20">Explore your data. Shape your charts. Simplify your files.</text>
    <rect x="50" y="328" width="220" height="40" rx="20" fill="#0F172A"/>
    <text x="160" y="353" fill="white" font-size="14" text-anchor="middle" font-weight="600">WORKBOOK ANALYTICS</text>
